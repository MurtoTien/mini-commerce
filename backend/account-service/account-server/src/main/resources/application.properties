spring.application.name=account-service
server.port=8081

spring.datasource.url=${ACCOUNT_DB_URL:jdbc:mysql://127.0.0.1:3306/account_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# HTTP 和 Dubbo 使用两个独立端口；店铺已使用 20881。
dubbo.application.name=account-service
dubbo.registry.address=${DUBBO_REGISTRY_ADDRESS:zookeeper://127.0.0.1:2181}
dubbo.protocol.name=dubbo
dubbo.protocol.port=${ACCOUNT_DUBBO_PORT:20882}
dubbo.application.qos-enable=false
