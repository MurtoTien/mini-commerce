spring.application.name=goods-service
server.port=8083

spring.datasource.url=${GOODS_DB_URL:jdbc:mysql://127.0.0.1:3306/goods_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ?? base url
services.shop.base-url=${SHOP_HTTP_URL:http://localhost:8082}

dubbo.application.name=goods-service
dubbo.registry.address=${DUBBO_REGISTRY_ADDRESS:zookeeper://127.0.0.1:2181}
dubbo.application.qos-enable=false
